
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEC GROUP CRM</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/vDAvXw3.png">
    <script>
      (function() {
        function isRefreshTokenError(err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : (err.message || err.error_description || (typeof err === 'object' ? ((err.name || '') + ': ' + (err.message || JSON.stringify(err))) : String(err)));
          var lower = String(str).toLowerCase();
          return lower.indexOf('refresh token') !== -1 || lower.indexOf('refresh_token') !== -1 || lower.indexOf('invalid_grant') !== -1;
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isRefreshTokenError(arguments[i])) {
              console.warn('[Auth] Refresh token notice suppressed.');
              return;
            }
          }
          return origError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isRefreshTokenError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          if (isRefreshTokenError(event.message) || isRefreshTokenError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(8px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>

</body>
</html>
